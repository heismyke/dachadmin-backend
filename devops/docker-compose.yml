name: dachcourier

services:
  dachcourier-admin-backend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      DB_HOST: dachcourier-postgres
      DB_USER: ${DB_USER:-myke}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_NAME: ${DB_NAME:-dachcourier-admin}
      DB_PORT: 5432
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    ports:
      - "${API_PORT:-8000}:${APP_PORT:-8080}"
    depends_on:
      dachcourier-postgres:
        condition: service_healthy

  dachcourier-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-myke}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-dachcourier-admin}
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-myke} -d ${DB_NAME:-dachcourier-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
