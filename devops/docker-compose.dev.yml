name: dachcourier-dev

services:
  dachcourier-admin-backend:
    extends:
      file: docker-compose.yml
      service: dachcourier-admin-backend
    environment:
       APP_ENV: development
       CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174,http://localhost:5175}
  
  dachcourier-postgres:
    extends: 
      file: docker-compose.yml
      service: dachcourier-postgres


volumes:
  postgres-data: